# Contoh konfigurasi Nginx untuk SPLP SiCantik API Checker.
# Letakkan blok `map` dan `limit_req_zone` di konteks http (misalnya /etc/nginx/conf.d/splp-checker.conf).

# IP klien: di belakang Cloudflare pakai CF-Connecting-IP, jika tidak ada pakai IP koneksi langsung.
map $http_cf_connecting_ip $splp_client_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
# Batasi hanya request POST (aksi test). Halaman biasa tidak dibatasi.
map $request_method $splp_post_key {
    default "";
    POST    $splp_client_ip;
}
limit_req_zone $splp_post_key zone=splp_post:10m rate=30r/m;

server {
    listen 80;
    server_name checker.example.com;
    root /var/www/splp-checker;
    index index.php;

    client_max_body_size 1M;
    limit_req_status 429;
    # Untuk instance publik: jangan diindeks mesin pencari
    # add_header X-Robots-Tag "noindex, nofollow" always;
    # location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Hanya index.php yang boleh dieksekusi; .php lain (src/, views/, dst.) dijawab 404.
    # Penting: aturan regex `\.php$` yang longgar akan menang atas aturan blokir folder di bawah.
    location = /index.php {
        limit_req zone=splp_post burst=10 nodelay;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP
    }
    location ~ \.php$ { return 404; }

    # Wajib: blokir berkas sensitif (Nginx tidak membaca .htaccess)
    location ^~ /.well-known/acme-challenge/    { allow all; }   # untuk Certbot
    location ~ /\.                              { deny all; }
    location ~* \.(sqlite|sqlite-wal|sqlite-shm|db|log|bak)$ { deny all; }
    location ~ ^/(data|src|views)(/|$)          { return 404; }
    location = /config.php                      { return 404; }
    location = /set-password.php                { return 404; }

    # Nginx tidak mencatat body request secara bawaan, jadi token di body POST tidak masuk log.
    access_log /var/log/nginx/splp-checker-access.log;
}
